repos:
-   repo: local
    hooks:
    -   id: isort
        name: isort
        entry: make sort
        language: system
        types: [python]

    -   id: flake8
        name: Flake8
        entry: poetry run flake8
        language: system
        types: [python]

    -   id: black
        name: black
        entry: poetry run black
        language: system
        types: [python]

    -   id: trailing-whitespace
        name: Trim Trailing Space
        entry: poetry run trailing-whitespace-fixer
        language: system
        types: [non-executable, file, text]
        exclude_types: [svg]

    -   id: end-of-file-fixer
        name: Fix End of Files
        description: Ensures that a file is either empty, or ends with one newline.
        entry: poetry run end-of-file-fixer
        language: system
        types: [non-executable, file, text]
        exclude_types: [svg]

    -   id: check-merge-conflict
        name: Check for merge conflicts
        description: Check for files that contain merge conflict strings.
        entry: poetry run check-merge-conflict
        language: system
        stages: [pre-push]

    -   id: codespell
        name: Check Spelling
        description: Checks for common misspellings in text files.
        entry: poetry run codespell --ignore-words .aspell.en.pws
        language: system
        types: [non-executable, file, text]
        exclude_types: [svg]
        stages: [pre-push]

    -   id: debug-statements
        name: Check Debug Statements Absent (Python)
        description: Checks that debug statements (pdb, ipdb, pudb) are not imported on commit.
        entry: poetry run debug-statement-hook
        language: system
        types: [python]
        stages: [pre-push]

    -   id: actions-lock
        name: Verify actions.lock
        description: Check every action is locked, and every lock still matches upstream
        entry: gh-actions-lock --verify
        language: system
        files: ^\.github/workflows/|(^|/)action\.ya?ml$
        pass_filenames: false
        verbose: true
